<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Cat Image Gallery</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Random Cat Image Gallery</h1>
    {% if cat_image_url %}
        <img src="{{ cat_image_url }}" alt="Random Cat Image">
    {% else %}
        <p>Could not load a cat image at this time. Please try again later.</p>
    {% endif %}
    <button onclick="window.location.href='/new'">Get New Image</button>
</body>
</html>
